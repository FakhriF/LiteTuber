name: Tauri Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust server
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('LiteTuber {0}', github.ref_name) || '' }}
          releaseBody: |
            Windows installer for LiteTuber ${{ github.ref_name }}.

            - Download the `*-setup.exe` file from Assets.
            - Run the installer, then open **LiteTuber** from the Start Menu.
            - The build without an installer is `*-portable.zip`: extract it, then run `LiteTuber.exe`.
            - This build is not signed, so SmartScreen may appear: **More info -> Run anyway**.
            - In OBS, add a Browser Source with the URL `http://127.0.0.1:8770/?ui=0`.

            Full guide: https://github.com/FakhriF/LiteTuber/blob/main/docs/PANDUAN.md
          releaseDraft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: litetuber-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = @"
          LiteTuber $version (portable)

          Run LiteTuber.exe. No installer needed.

          Data is still stored in:
          %APPDATA%\app.litetuber.desktop\

          Settings, avatars, backgrounds, and profiles are not lost when the ZIP
          folder moves, but they do not come along if you copy this folder to
          another PC.

          OBS Browser Source: http://127.0.0.1:8770/?ui=0
          Guide: https://github.com/FakhriF/LiteTuber/blob/main/docs/PANDUAN.md

          This build is not signed. If SmartScreen appears, choose
          More info -> Run anyway.

          Requires the WebView2 Runtime. Windows 10/11 usually has it already.
          "@
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/litetuber.exe portable/LiteTuber.exe
          Set-Content -Path portable/README.txt -Value $notes -Encoding UTF8
          Compress-Archive -Path portable/* -DestinationPath "LiteTuber_${version}_x64-portable.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: litetuber-portable
          path: LiteTuber_*_x64-portable.zip
          if-no-files-found: error

      - name: Attach portable ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload ${{ github.ref_name }} "LiteTuber_${version}_x64-portable.zip" --clobber
