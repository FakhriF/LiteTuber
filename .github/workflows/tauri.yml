name: Tauri Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust server
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('LiteTuber {0}', github.ref_name) || '' }}
          releaseBody: |
            Installer Windows untuk LiteTuber ${{ github.ref_name }}.

            - Unduh file `*-setup.exe` di bagian Assets.
            - Jalankan installer, lalu buka **LiteTuber** dari Start Menu.
            - Versi tanpa installer ada di `*-portable.zip`: ekstrak, lalu jalankan `LiteTuber.exe`.
            - Build ini belum ditandatangani, jadi SmartScreen bisa muncul: **More info -> Run anyway**.
            - Di OBS, tambahkan Browser Source dengan URL `http://127.0.0.1:8770/?ui=0`.

            Panduan lengkap ada di https://github.com/FakhriF/LiteTuber/blob/main/docs/PANDUAN.md
          releaseDraft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: litetuber-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = @"
          LiteTuber $version (portable)

          Jalankan LiteTuber.exe. Tidak perlu installer.

          Data tetap disimpan di:
          %APPDATA%\app.litetuber.desktop\

          Artinya setelan, avatar, background, dan profil tidak hilang saat folder ZIP
          dipindah, tapi juga tidak ikut kalau folder ini disalin ke PC lain.

          OBS Browser Source: http://127.0.0.1:8770/?ui=0
          Panduan: https://github.com/FakhriF/LiteTuber/blob/main/docs/PANDUAN.md

          Build ini belum ditandatangani. Kalau SmartScreen muncul, pilih
          More info -> Run anyway.

          Butuh WebView2 Runtime. Windows 10/11 biasanya sudah punya.
          "@
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/litetuber.exe portable/LiteTuber.exe
          Set-Content -Path portable/BACA-INI.txt -Value $notes -Encoding UTF8
          Compress-Archive -Path portable/* -DestinationPath "LiteTuber_${version}_x64-portable.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: litetuber-portable
          path: LiteTuber_*_x64-portable.zip
          if-no-files-found: error

      - name: Attach portable ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload ${{ github.ref_name }} "LiteTuber_${version}_x64-portable.zip" --clobber
