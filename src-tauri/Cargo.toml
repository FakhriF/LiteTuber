[package]
name = "litetuber"
version = "0.1.0"
description = "Lightweight VRM VTuber app for browser/OBS"
authors = ["LiteTuber"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "litetuber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
